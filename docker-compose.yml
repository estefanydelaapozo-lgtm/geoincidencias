services:
  db:
    image: mysql:8.0
    container_name: geo_db_final
    restart: unless-stopped
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: "geoRoot_2026!"
      MYSQL_DATABASE: "geoincidencias"
      MYSQL_USER: "geo_user"
      MYSQL_PASSWORD: "geoPass_2026!"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pgeoRoot_2026!"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    container_name: geo_backend_final
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend-laravel/.env.docker
    environment:
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "geoincidencias"
      DB_USERNAME: "geo_user"
      DB_PASSWORD: "geoPass_2026!"
      APP_ENV: local
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      CACHE_STORE: file
      SESSION_DRIVER: file
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geo_frontend_final
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: geo_caddy_final
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  backend_storage:
  db_data:
  caddy_data:
  caddy_config:
