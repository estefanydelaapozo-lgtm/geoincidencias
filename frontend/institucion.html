<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Panel institucional | GeoIncidencias</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="bootstrap-theme.css?v=1">
  <link rel="stylesheet" href="styles.min.css?v=20260731-6"/>
</head>
<body class="institution-page">

<div id="sidebarContainer"></div>
<div id="toastContainer"></div>

<main class="main-content">
  <div class="page-header">
    <div>
      <div class="page-eyebrow" id="rolIcono">INSTITUCIÓN</div>
      <div class="page-title" id="rolNombre">Panel institucional</div>
      <div class="page-subtitle" id="rolDescripcion">Incidencias asignadas a tu área responsable.</div>
    </div>
  </div>

  <div class="stat-grid mb-24">
    <div class="stat-card stat-cyan">
      <div class="stat-label">Total asignadas</div>
      <div class="stat-value" id="kTotal">0</div>
    </div>
    <div class="stat-card stat-coral">
      <div class="stat-label">Pendientes</div>
      <div class="stat-value" id="kPendientes">0</div>
    </div>
    <div class="stat-card stat-green">
      <div class="stat-label">Resueltas</div>
      <div class="stat-value" id="kResueltas">0</div>
    </div>
  </div>

  <div class="card" style="padding:16px 18px;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;">
      <div>
        <span class="card-title">◈ Mis incidencias</span>
        <div style="font-size:.75rem;color:var(--text-muted);margin-top:2px;">Solo se muestran casos correspondientes a tu rol.</div>
      </div>
      <a class="btn btn-primary btn-sm" href="incidencias.html">Ver todas</a>
    </div>
    <div id="tbodyInstitucion" class="field-list">
      <div style="text-align:center;padding:50px;color:var(--text-muted);"><span class="spin">⟳</span> Cargando…</div>
    </div>
  </div>
</main>

<!-- Modal de gestión: cambiar estado, subir evidencia y comentar (Técnico/institucional) -->
<div class="modal-backdrop" id="modalGestionInst">
  <div class="modal-box" style="max-width:560px;">
    <div class="modal-head">
      <h3 id="gi_titulo">Gestionar incidencia</h3>
      <button class="btn-close-modal" onclick="cerrarModalGestionInst()">✕</button>
    </div>
    <div class="modal-body">
      <p id="gi_desc" style="color:var(--text-secondary);font-size:.85rem;margin-bottom:10px;"></p>
      <div id="gi_badgeEstado" style="margin-bottom:14px;"></div>

      <div class="form-group mb-16">
        <label class="form-label">Cambiar estado</label>
        <div class="flex gap-8">
          <select id="gi_estado" class="form-select"></select>
          <button class="btn btn-primary btn-sm" onclick="giCambiarEstado()">Actualizar</button>
        </div>
        <div id="gi_avisoEstado" style="margin-top:6px;font-size:.75rem;color:var(--text-muted);"></div>
      </div>

      <div class="form-group mb-16">
        <label class="form-label">Subir evidencia / fotografía</label>
        <input type="file" id="gi_foto" class="form-control" accept="image/png,image/jpeg">
        <button class="btn btn-ghost btn-sm mt-16" onclick="giSubirFoto()">Subir foto</button>
        <div id="gi_fotoActual" style="margin-top:10px;"></div>
      </div>

      <div class="form-group mb-16">
        <label class="form-label">Observaciones técnicas</label>
        <textarea id="gi_comentario" class="form-control" rows="3" placeholder="Describe el avance o la observación técnica..."></textarea>
        <button class="btn btn-ghost btn-sm mt-16" onclick="giAgregarComentario()">Agregar observación</button>
      </div>

      <div>
        <label class="form-label">Seguimiento</label>
        <div id="gi_comentarios" style="font-size:.8rem;color:var(--text-secondary);max-height:160px;overflow-y:auto;"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/auth-guard.js?v=20260731-2"></script>
<script src="js/sidebar.js?v=20260731-2"></script>
<script>
exigirSesion();
const uInst = getUsuario();
if (!uInst?.es_institucional && !['admin','supervisor'].includes(uInst?.rol)) location.href = 'index.html';
inyectarSidebar('institucion');
inicializarBarraUsuario();

(async () => {
  try {
    const r = await fetchAPI(`${API}/institucional/resumen`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.mensaje || 'Error al cargar');
    document.getElementById('rolNombre').textContent = d.rol?.nombre || 'Panel institucional';
    document.getElementById('rolIcono').textContent = `${d.rol?.icono || '⌂'} ÁREA RESPONSABLE`;
    document.getElementById('rolDescripcion').textContent = d.rol?.descripcion || 'Gestión institucional de incidencias';
    document.documentElement.style.setProperty('--role-color', d.rol?.color || '#06b6d4');
    document.getElementById('kTotal').textContent = d.total;
    document.getElementById('kPendientes').textContent = d.pendientes;
    document.getElementById('kResueltas').textContent = d.resueltas;
    const tbody = document.getElementById('tbodyInstitucion');
    tbody.innerHTML = (d.ultimas || []).map(i => `
      <div class="field-card">
        <div class="field-card-id">#${i.id_incidencia}</div>
        <div class="field-card-body">
          <div class="field-card-title">${i.titulo}</div>
          <div class="field-card-meta">${i.tipo?.nombre || '—'} · ${i.zona?.nombre || '—'} · ${i.prioridad} · <span style="color:${i.estado?.color || '#64748b'};font-weight:700;">${i.estado?.nombre || '—'}</span></div>
        </div>
        <div class="field-card-action"><button class="btn btn-ghost btn-sm" onclick="abrirGestionInst(${i.id_incidencia})">Gestionar →</button></div>
      </div>`).join('') || '<div style="text-align:center;padding:50px;color:var(--text-muted);">No hay incidencias asignadas a esta institución.</div>';
  } catch (e) {
    document.getElementById('tbodyInstitucion').innerHTML =
      `<div style="text-align:center;padding:50px;color:var(--coral);">${e.message || 'Error al cargar'}</div>`;
  }
})();

// ── Gestión de incidencia asignada: estado, evidencia y observaciones ──
let giIdActual = null;
const GI_ETIQUETAS = { 'Registrada':'Registrada','En proceso':'En proceso','Resuelta':'Resuelta','Cerrada':'Cerrada','En verificación':'En verificación','Reabierta':'Reabierta' };

async function abrirGestionInst(id) {
  giIdActual = id;
  document.getElementById('modalGestionInst').classList.add('open');
  document.getElementById('gi_titulo').textContent = `Incidencia #${id}`;
  document.getElementById('gi_desc').textContent = 'Cargando…';
  document.getElementById('gi_badgeEstado').innerHTML = '';
  document.getElementById('gi_avisoEstado').textContent = '';
  try {
    const r = await fetchAPI(`${API}/incidencias/${id}`);
    const inc = await r.json();
    document.getElementById('gi_titulo').textContent = inc.titulo || `Incidencia #${id}`;
    document.getElementById('gi_desc').textContent = inc.descripcion || '';
    document.getElementById('gi_badgeEstado').innerHTML =
      `<span class="badge" style="background:${inc.color_estado||'#64748b'}18;color:${inc.color_estado||'#64748b'};border:1px solid ${inc.color_estado||'#64748b'}40;">${inc.estado||'—'}</span>`;
    const opciones = (inc.siguientes_estados || []);
    const estados = await (await fetchAPI(`${API}/catalogos/estados`)).json();
    const sel = document.getElementById('gi_estado');
    const filtrados = estados.filter(e => opciones.includes(e.nombre));
    sel.innerHTML = filtrados.length
      ? filtrados.map(e => `<option value="${e.id}">${GI_ETIQUETAS[e.nombre] || e.nombre}</option>`).join('')
      : `<option value="">Sin transiciones disponibles</option>`;
    sel.disabled = !filtrados.length;
    const aviso = document.getElementById('gi_avisoEstado');
    if (filtrados.length) {
      aviso.textContent = '';
    } else if (inc.estado === 'Cerrada') {
      aviso.textContent = 'Esta incidencia ya fue verificada y cerrada por el supervisor. No requiere más acciones de tu parte.';
    } else if (inc.estado === 'Resuelta') {
      aviso.textContent = 'Ya la marcaste como resuelta. Ahora está esperando la verificación del supervisor — no hay más pasos para ti por ahora.';
    } else if (inc.estado === 'En verificación') {
      aviso.textContent = 'El supervisor está revisando tu evidencia. Espera su verificación.';
    } else {
      aviso.textContent = 'No hay un siguiente estado disponible para esta incidencia en este momento.';
    }
    document.getElementById('gi_fotoActual').innerHTML = inc.foto_url
      ? `<img src="${inc.foto_url}" style="max-width:100%;border-radius:8px;border:1px solid var(--border-light);">`
      : '<span style="color:var(--text-muted);font-size:.78rem;">Sin fotografía cargada.</span>';
    await giCargarComentarios();
  } catch (e) {
    document.getElementById('gi_desc').textContent = 'No se pudo cargar la incidencia.';
  }
}

function cerrarModalGestionInst() {
  document.getElementById('modalGestionInst').classList.remove('open');
  giIdActual = null;
}

async function giCargarComentarios() {
  try {
    const r = await fetchAPI(`${API}/incidencias/${giIdActual}/comentarios`);
    const d = await r.json();
    const lista = d.datos || [];
    document.getElementById('gi_comentarios').innerHTML = lista.length
      ? lista.map(c => `<div style="margin-bottom:8px;"><strong>${c.autor}</strong> <span style="color:var(--text-muted);">(${c.fecha})</span><br>${c.comentario}</div>`).join('')
      : '<span style="color:var(--text-muted);">Sin observaciones registradas.</span>';
  } catch (e) {}
}

async function giCambiarEstado() {
  const idEstado = document.getElementById('gi_estado').value;
  if (!idEstado) return mostrarToast('Selecciona un estado válido.', 'warning');
  const comentario = await pedirTexto({ titulo: 'Cambiar estado', mensaje: 'Cuéntanos brevemente qué avance hiciste.', placeholder: 'Ej: se reemplazó la luminaria dañada…', minLen: 5, textoBoton: 'Actualizar estado' });
  if (comentario === null) return;
  try {
    const res = await fetchAPI(`${API}/incidencias/${giIdActual}/estado`, { method: 'PUT', body: JSON.stringify({ id_estado: idEstado, comentario: comentario.trim() }) });
    const d = await res.json();
    if (res.ok && d.ok) { mostrarToast(d.mensaje || 'Estado actualizado.', 'success'); abrirGestionInst(giIdActual); }
    else mostrarToast(d.mensaje || 'No se pudo actualizar el estado.', 'danger');
  } catch (e) { mostrarToast('Error de conexión.', 'danger'); }
}

async function giSubirFoto() {
  const input = document.getElementById('gi_foto');
  if (!input.files[0]) return mostrarToast('Selecciona una imagen primero.', 'warning');
  const fd = new FormData();
  fd.append('foto', input.files[0]);
  try {
    const res = await fetchAPI(`${API}/incidencias/${giIdActual}/foto`, { method: 'POST', body: fd });
    const d = await res.json();
    if (res.ok && d.ok) { mostrarToast('Evidencia subida correctamente.', 'success'); abrirGestionInst(giIdActual); }
    else mostrarToast(d.mensaje || 'No se pudo subir la foto.', 'danger');
  } catch (e) { mostrarToast('Error de conexión al subir la foto.', 'danger'); }
}

async function giAgregarComentario() {
  const texto = document.getElementById('gi_comentario').value.trim();
  if (texto.length < 3) return mostrarToast('Escribe una observación de al menos 3 caracteres.', 'warning');
  try {
    const res = await fetchAPI(`${API}/incidencias/${giIdActual}/comentarios`, { method: 'POST', body: JSON.stringify({ comentario: texto }) });
    const d = await res.json();
    if (res.ok && d.ok) { document.getElementById('gi_comentario').value = ''; mostrarToast('Observación agregada.', 'success'); giCargarComentarios(); }
    else mostrarToast(d.mensaje || 'No se pudo agregar la observación.', 'danger');
  } catch (e) { mostrarToast('Error de conexión.', 'danger'); }
}
</script>
</body>
</html>
