<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoIncidencias — Perfil</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="bootstrap-theme.css?v=1">
  <link rel="stylesheet" href="styles.css?v=20260731-6"/></head><body><div id="sidebarContainer"></div><main class="main-content profile-pro"><div class="page-header"><div><div class="eyebrow">CUENTA Y SEGURIDAD</div><div class="page-title">Perfil de usuario</div><div class="page-subtitle">Administra tus datos, fotografía y credenciales de acceso.</div></div><span class="status-pill">● Perfil protegido</span></div>
<section class="profile-hero glass-panel"><div id="perfilAvatar" class="profile-avatar-xl">U</div><div><h2 id="perfilNombreDisplay">Cargando…</h2><p id="perfilRolDisplay">—</p><div class="profile-meta"><span id="perfilCorreoDisplay">—</span><span id="perfilProvider">Acceso local</span></div></div><label class="btn btn-ghost upload-trigger">Cambiar foto<input type="file" id="pFoto" accept="image/jpeg,image/png,image/webp" hidden></label></section>
<div class="profile-layout"><section class="card glass-panel"><div class="section-head"><div><span class="section-kicker">INFORMACIÓN PERSONAL</span><h3>Datos de contacto</h3></div><span>Los cambios se reflejan en todo el sistema.</span></div><form id="perfilForm" novalidate><div class="form-grid"><label>Nombre<input id="pNombre" class="form-control" required maxlength="100"><small class="field-error"></small></label><label>Apellidos<input id="pApellido" class="form-control" maxlength="100"><small class="field-error"></small></label><label>Correo electrónico<input id="pCorreo" type="email" class="form-control" required maxlength="150"><small class="field-error"></small></label><label>Teléfono / contacto<input id="pTelefono" class="form-control" maxlength="20" placeholder="+593 99 000 0000"><small class="field-error"></small></label></div><button class="btn btn-primary" type="submit">Guardar cambios</button></form></section>
<section class="card glass-panel"><div class="section-head"><div><span class="section-kicker">SEGURIDAD</span><h3>Cambiar contraseña</h3></div><span>Usa al menos 8 caracteres.</span></div><form id="passwordForm" novalidate><label>Contraseña actual<div class="password-wrap"><input id="pPassActual" type="password" class="form-control" required><button type="button" class="password-toggle" data-target="pPassActual">Mostrar</button></div></label><label>Nueva contraseña<div class="password-wrap"><input id="pPassNueva" type="password" class="form-control" required><button type="button" class="password-toggle" data-target="pPassNueva">Mostrar</button></div><div class="password-meter"><i id="passwordMeter"></i></div><small id="passwordHint">Incluye mayúscula, minúscula y número.</small></label><label>Confirmar nueva contraseña<div class="password-wrap"><input id="pPassConfirm" type="password" class="form-control" required><button type="button" class="password-toggle" data-target="pPassConfirm">Mostrar</button></div><small id="passwordMatch"></small></label><button class="btn btn-secondary" type="submit">Actualizar contraseña</button></form></section></div></main>
<script src="js/auth-guard.js?v=20260731-2"></script><script src="js/sidebar.js?v=20260731-2"></script><script>
exigirSesion();inyectarSidebar('perfil');inicializarBarraUsuario();const u=getUsuario();
function avatar(usuario){const el=document.getElementById('perfilAvatar');el.innerHTML=usuario.foto_url?`<img src="${usuario.foto_url}?v=${Date.now()}" alt="Foto">`:(usuario.nombre||'U')[0].toUpperCase()}
function fill(usuario){pNombre.value=usuario.nombre||'';pApellido.value=usuario.apellido||'';pCorreo.value=usuario.correo||'';pTelefono.value=usuario.telefono||'';perfilNombreDisplay.textContent=`${usuario.nombre||''} ${usuario.apellido||''}`.trim();perfilRolDisplay.textContent=usuario.rol_detalle?.nombre||usuario.rol;perfilCorreoDisplay.textContent=usuario.correo;perfilProvider.textContent=usuario.auth_provider?.includes('google')?'Google OAuth + cuenta local':'Acceso local';avatar(usuario)}
fill(u);fetchAPI(`${API}/auth/perfil`).then(r=>r.json()).then(d=>{localStorage.setItem('gi_usuario',JSON.stringify(d));fill(d)}).catch(()=>{});
pFoto.addEventListener('change',async()=>{const f=pFoto.files[0];if(!f)return;if(f.size>2097152)return mostrarToast('La imagen supera 2 MB.','danger');const fd=new FormData();fd.append('foto',f);const r=await fetchAPI(`${API}/auth/foto-perfil`,{method:'POST',body:fd});const d=await r.json();if(!r.ok)return mostrarToast(d.mensaje||'No se pudo subir.','danger');const nu={...getUsuario(),foto_url:d.foto_url};localStorage.setItem('gi_usuario',JSON.stringify(nu));avatar(nu);mostrarToast('Foto actualizada.','success')});
perfilForm.addEventListener('submit',async e=>{e.preventDefault();const payload={nombre:pNombre.value.trim(),apellido:pApellido.value.trim(),correo:pCorreo.value.trim(),telefono:pTelefono.value.trim()};if(!payload.nombre||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.correo))return mostrarToast('Revisa nombre y correo.','warning');const r=await fetchAPI(`${API}/usuarios/${u.id_usuario}`,{method:'PUT',body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)return mostrarToast(d.mensaje||'No se pudo guardar.','danger');const nu={...getUsuario(),...d.usuario};localStorage.setItem('gi_usuario',JSON.stringify(nu));fill(nu);mostrarToast('Perfil actualizado.','success')});
function strength(v){let n=0;if(v.length>=8)n++;if(/[A-Z]/.test(v))n++;if(/[a-z]/.test(v))n++;if(/[0-9]/.test(v))n++;if(/[^A-Za-z0-9]/.test(v))n++;passwordMeter.style.width=`${n*20}%`;passwordMeter.dataset.level=n}
pPassNueva.addEventListener('input',()=>{strength(pPassNueva.value);passwordMatch.textContent=pPassConfirm.value?(pPassConfirm.value===pPassNueva.value?'Las contraseñas coinciden.':'Las contraseñas no coinciden.'):' '});pPassConfirm.addEventListener('input',()=>passwordMatch.textContent=pPassConfirm.value===pPassNueva.value?'Las contraseñas coinciden.':'Las contraseñas no coinciden.');document.querySelectorAll('.password-toggle').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.target);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Mostrar':'Ocultar'});
passwordForm.addEventListener('submit',async e=>{e.preventDefault();const n=pPassNueva.value;if(n!==pPassConfirm.value)return mostrarToast('Las contraseñas no coinciden.','danger');if(n.length<8||!/[A-Z]/.test(n)||!/[a-z]/.test(n)||!/[0-9]/.test(n))return mostrarToast('La contraseña no cumple la política.','warning');const r=await fetchAPI(`${API}/auth/cambiar-password`,{method:'POST',body:JSON.stringify({password_actual:pPassActual.value,password_nuevo:n})});const d=await r.json();if(!r.ok)return mostrarToast(d.mensaje||'No se pudo cambiar.','danger');passwordForm.reset();strength('');mostrarToast('Contraseña actualizada.','success')});
</script></body></html>
