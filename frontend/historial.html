<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>GeoIncidencias — Historial</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="bootstrap-theme.css?v=1">
  <link rel="stylesheet" href="styles.min.css?v=20260731-6"/>
</head>
<body>

<div id="sidebarContainer"></div>

<main class="main-content">
  <div class="page-header">
    <div>
      <div class="page-title">Historial de actividad</div>
      <div class="page-subtitle">Registro de todas las acciones realizadas en el sistema</div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="card mb-24" style="padding:14px 18px;">
    <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;">
      <div>
        <label class="form-label">Usuario</label>
        <select id="filtroUsuario" class="form-select" onchange="cargarHistorial(1)" style="width:200px;">
          <option value="">Todos los usuarios</option>
        </select>
      </div>
      <div>
        <label class="form-label">Acción</label>
        <select id="filtroAccion" class="form-select" onchange="cargarHistorial(1)" style="width:180px;">
          <option value="">Todas las acciones</option>
          <option>login</option><option>logout</option><option>crear</option>
          <option>editar</option><option>eliminar</option><option>aprobar</option><option>rechazar</option>
        </select>
      </div>
      <div>
        <label class="form-label">Desde</label>
        <input type="date" id="filtroDesde" class="form-control" onchange="cargarHistorial(1)" style="width:160px;"/>
      </div>
      <div>
        <label class="form-label">Hasta</label>
        <input type="date" id="filtroHasta" class="form-control" onchange="cargarHistorial(1)" style="width:160px;"/>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="limpiar()" style="height:40px;">↺ Limpiar</button>
    </div>
  </div>

  <!-- Timeline / Tabla -->
  <div class="card" style="padding:0;">
    <div class="card-header" style="padding:14px 18px;margin:0;">
      <span class="card-title">⟳ Registro de actividad</span>
      <span id="totalHistorial" style="font-size:.75rem;color:var(--text-muted);"></span>
    </div>
    <div style="overflow-x:auto;">
      <table class="gi-table">
        <thead>
          <tr><th>Fecha/Hora</th><th>Usuario</th><th>Acción</th><th>Módulo</th><th>Detalle</th><th>IP</th></tr>
        </thead>
        <tbody id="tbodyHistorial">
          <tr><td colspan="6" style="text-align:center;padding:50px;color:var(--text-muted);"><span class="spin">⟳</span> Cargando…</td></tr>
        </tbody>
      </table>
    </div>
    <div style="padding:14px 18px;border-top:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;">
      <span id="paginaInfoH" style="font-size:.78rem;color:var(--text-muted);"></span>
      <div class="pagination" id="paginacionH"></div>
    </div>
  </div>
</main>

<script src="js/auth-guard.js?v=20260731-2"></script>
<script src="js/sidebar.js?v=20260731-2"></script>
<script src="js/historial.min.js?v=20260725-1"></script>
<script>
exigirAdmin();
inyectarSidebar('historial');
inicializarBarraUsuario();
</script>
</body>
</html>
